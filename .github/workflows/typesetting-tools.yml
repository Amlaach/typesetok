name: Optional headless typesetting tools
on:
  pull_request:
    paths:
      - 'tools/typesetting-agent/**'
      - '.github/workflows/typesetting-tools.yml'
  push:
    branches: [improve/engine-optimization]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/typesetting-agent/requirements.txt
      - run: python -m pip install -r tools/typesetting-agent/requirements.txt pytest==9.1.1
      - run: python -m pytest tools/typesetting-agent/tests -q
