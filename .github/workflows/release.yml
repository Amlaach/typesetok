name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.7.5)'
        required: false
        default: 'v0.7.5'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_TARGET_DIR: target

jobs:
  # ──────────────────────────────────────────────
  # 0. Check if release build is needed
  # ──────────────────────────────────────────────
  check-release:
    name: Check Release Trigger
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag and check existing release
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            # Push to main: extract version from package.json
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
            echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Release for $TAG already exists (HTTP 200). Skipping release build."
              echo "should_release=false" >> $GITHUB_OUTPUT
            else
              echo "Release for $TAG does not exist (HTTP $HTTP_STATUS). Starting release build for $TAG!"
              echo "should_release=true" >> $GITHUB_OUTPUT
            fi
          fi

  # ──────────────────────────────────────────────
  # 1. Build tok-cli native binaries for all platforms
  # ──────────────────────────────────────────────
  build-binaries:
    name: Build Binary (${{ matrix.os }})
    needs: [check-release]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: tok-cli
            asset_name: tok-cli-v0.7.5-linux-x64.tar.gz
          - os: windows-latest
            binary_name: tok-cli.exe
            asset_name: tok-cli-v0.7.5-windows-x64.zip
          - os: macos-latest
            binary_name: tok-cli
            asset_name: tok-cli-v0.7.5-macos.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup (Windows Installer)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - uses: Swatinem/rust-cache@v2

      - name: Build tok-cli (Release)
        run: cargo build --release -p tok-cli

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          tar -czvf ${{ matrix.asset_name }} -C target/release ${{ matrix.binary_name }}

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/${{ matrix.binary_name }} -DestinationPath ${{ matrix.asset_name }}

      - name: Setup Node.js (Windows Desktop App)
        if: matrix.os == 'windows-latest'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package Standalone Desktop App (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          npm install
          npm run build
          node scripts/build-desktop-bundle.mjs
          Compress-Archive -Path dist/TypesetOK-v0.7.5-windows-x64 -DestinationPath TypesetOK-v0.7.5-windows-desktop-app.zip

      - name: Compile Official Windows Installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          node scripts/build-installer.mjs
          Copy-Item dist/TypesetOK-v0.7.5-Setup-x64.exe TypesetOK-v0.7.5-Setup.exe

      - name: Upload Windows Installer artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TypesetOK-v0.7.5-Setup.exe
          path: TypesetOK-v0.7.5-Setup.exe

      - name: Upload Desktop App artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TypesetOK-v0.7.5-windows-desktop-app.zip
          path: TypesetOK-v0.7.5-windows-desktop-app.zip

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  # ──────────────────────────────────────────────
  # 2. Build Frontend & UI Workbench Distribution
  # ──────────────────────────────────────────────
  build-frontend:
    name: Build Frontend UI Distribution
    needs: [check-release]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript packages & UI bundle
        run: npm run build

      - name: Package UI distribution bundle
        run: |
          mkdir -p dist-package
          cp -r packages/tok-ui/dist dist-package/ui
          cp -r packages/tok-electron/dist dist-package/electron
          cp -r assets dist-package/assets
          cp README.md LICENSE.md dist-package/
          tar -czvf typesetok-desktop-workbench-v0.7.5.tar.gz dist-package

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: typesetok-desktop-workbench-v0.7.5.tar.gz
          path: typesetok-desktop-workbench-v0.7.5.tar.gz

  # ──────────────────────────────────────────────
  # 3. Create GitHub Release & Attach Assets
  # ──────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [check-release, build-binaries, build-frontend]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: TypesetOK ${{ needs.check-release.outputs.tag_name }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## TypesetOK (TOK) ${{ needs.check-release.outputs.tag_name }} — תמיכה מלאה במשקלי גופנים, חוויית משתמש ומתקין רשמי

            ### 🚀 מה חדש בגרסה 0.7.5 (Highlights):
            - **תמיכה מלאה במשקלי גופנים (Font Weight 700 / 400):** תמיכה מלאה בהגדרת סגנונות מודגשים (Bold / 700) ורגילים (Regular / 400), הן בליבת העימוד והן בסרגלי הממשק (StructureBar, Action HUD, Inspector).
            - **מנוע טיפוגרפיה מתקדם ושילוב גופנים מובנים:** טעינת גופני OFL מודגשים (Frank Ruhl Libre Bold, Taamey Frank CLM Bold, Keter YG Bold) לעימוד כותרות וטקסט ש"ס מהודר.
            - **מתקין Windows רשמי (Setup Wizard):** קובץ התקנה מלא `TypesetOK-v0.7.5-Setup.exe` דו-לשוני (עברית ואנגלית), עם שיוך קובצי מסמך `.tok` וקיצור דרך בשולחן העבודה.
            - **ממשק משתמש מסודר ומופחת כפתורים:** צמצום עומס כפתורים בממשק, סידור היררכי חכם של תפריטים, וריכוז פקודות בסרגל עליון מינימליסטי ונוח.
            - **גיוון עשיר בצבעים וערכות נושא:** 5 ערכות עיצוב ייחודיות (כחול נייבי עמוק, קלף עברי מהודר, פחם גרפיט וזהב, אינדיגו רויאל ואזמרגד, וסטודיו בהיר קלאסי) + צבעי תזרימים מובחנים.
            - **הגדרות ואודות נגישים ישירות מכל מסך:** כפתורים ישירים בסרגל העליון, במסך הפתיחה (Welcome Dialog), בסרגל הצד ובפלטת הפקודות.
            - **עליית תוכנה מהירה במיוחד (Instant Launch):** מעבר מיידי ומהיר מחלון הספלאש לחלון הראשי ללא זמני המתנה מלאכותיים.
            - **הסרה מלאה של אימוג'ים:** החלפה של 100% מהאימוג'ים באייקונים וקטוריים מקצועיים (SVG).
            - **לשונית נגישות מקיפה:** ניגודיות גבוהה, הגדלת טקסט, הפחתת תנועה, הדגשת פוקוס למקלדת וגופן נגיש.

            ### 📦 קבצים להורדה (Downloads & Installation):
            - **מתקין רשמי למחשב (מומלץ):** `TypesetOK-v0.7.5-Setup.exe` (מתקין אשף מלא בעברית ובאנגלית).
            - **גרסה ניידת ללא התקנה (Portable):** `TypesetOK-v0.7.5-windows-desktop-app.zip` (פריקה והרצה ישירה של `TypesetOK.exe`).
            - **CLI בלבד (Windows x64):** `tok-cli-v0.7.5-windows-x64.zip`
            - **CLI בלבד (Linux x64):** `tok-cli-v0.7.5-linux-x64.tar.gz`
            - **CLI בלבד (macOS):** `tok-cli-v0.7.5-macos.tar.gz`
            - **Workbench Source Bundle:** `typesetok-desktop-workbench-v0.7.5.tar.gz`
