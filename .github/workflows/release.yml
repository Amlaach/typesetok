name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.6.0)'
        required: false
        default: 'v0.6.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────
  # 1. Build tok-cli native binaries for all platforms
  # ──────────────────────────────────────────────
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: tok-cli
            asset_name: tok-cli-v0.6.0-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: tok-cli.exe
            asset_name: tok-cli-v0.6.0-x86_64-pc-windows-msvc.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: tok-cli
            asset_name: tok-cli-v0.6.0-x86_64-apple-darwin.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build tok-cli (Release)
        run: cargo build --release -p tok-cli --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }} ${{ matrix.binary_name }}
          cd ../../..

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.binary_name }} -DestinationPath ${{ matrix.asset_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  # ──────────────────────────────────────────────
  # 2. Build Frontend & UI Workbench Distribution
  # ──────────────────────────────────────────────
  build-frontend:
    name: Build Frontend UI Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript packages & UI bundle
        run: npm run build

      - name: Package UI distribution bundle
        run: |
          mkdir -p dist-package
          cp -r packages/tok-ui/dist dist-package/ui
          cp -r packages/tok-electron/dist dist-package/electron
          cp -r assets dist-package/assets
          cp README.md LICENSE.md dist-package/
          tar -czvf typesetok-desktop-workbench-v0.6.0.tar.gz dist-package

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: typesetok-desktop-workbench-v0.6.0.tar.gz
          path: typesetok-desktop-workbench-v0.6.0.tar.gz

  # ──────────────────────────────────────────────
  # 3. Create GitHub Release & Attach Assets
  # ──────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-binaries, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: TypesetOK ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## TypesetOK (TOK) ${{ steps.tag.outputs.tag }}

            ### 🚀 מה חדש בגרסה 0.6.0 (Highlights):
            - **ניהול גופני עברית מקוריים (OFL):** הטמעת `Noto Serif Hebrew` ו-`David Libre` בעיצוב OpenType מלא דרך HarfBuzz / rustybuzz.
            - **גזירת גופנים ב-PDF (Font Subsetting):** הפקת TrueType Subsets מוקטנים עם קידוד Identity-H וטבלאות מיפוי `/ToUnicode` לחיפוש והעתקה תקינים של טקסט מנוקד.
            - **עריכה ישירה על גבי העמוד (WYSIWYG):** מנוע Hit-Testing מרחבי תת-פיקסלי, סמן אופטימי ב-RTL (<16ms), סימון טקסט בגרירת עכבר והקלדה ישירה.
            - **צורת הדף לש"ס (Talmud Multi-Flow):** פריסות צמודות (Recto/Verso: רש"י בצד השדרה ותוספות בצד החיצוני), שבירת צורה ב-L-Shape מתחת לגמרא, והערות שוליים צפות.
            - **100% כיסוי בדיקות:** 65 בדיקות Rust ו-15 בדיקות Frontend (סה"כ 80/80 בדיקות עוברות).

            ### 📦 קבצים להורדה (Pre-built Binaries):
            - **Windows (x64):** `tok-cli-v0.6.0-x86_64-pc-windows-msvc.zip`
            - **Linux (x64):** `tok-cli-v0.6.0-x86_64-unknown-linux-gnu.tar.gz`
            - **macOS (x64):** `tok-cli-v0.6.0-x86_64-apple-darwin.tar.gz`
            - **Desktop UI Workbench Bundle:** `typesetok-desktop-workbench-v0.6.0.tar.gz`
