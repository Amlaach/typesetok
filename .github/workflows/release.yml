name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.7.0)'
        required: false
        default: 'v0.7.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_TARGET_DIR: target

jobs:
  # ──────────────────────────────────────────────
  # 1. Build tok-cli native binaries for all platforms
  # ──────────────────────────────────────────────
  build-binaries:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: tok-cli
            asset_name: tok-cli-v0.7.0-linux-x64.tar.gz
          - os: windows-latest
            binary_name: tok-cli.exe
            asset_name: tok-cli-v0.7.0-windows-x64.zip
          - os: macos-latest
            binary_name: tok-cli
            asset_name: tok-cli-v0.7.0-macos.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build tok-cli (Release)
        run: cargo build --release -p tok-cli

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          tar -czvf ${{ matrix.asset_name }} -C target/release ${{ matrix.binary_name }}

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/${{ matrix.binary_name }} -DestinationPath ${{ matrix.asset_name }}

      - name: Setup Node.js (Windows Desktop App)
        if: matrix.os == 'windows-latest'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package Standalone Desktop App (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          npm install
          npm run build
          node scripts/build-desktop-bundle.mjs
          Compress-Archive -Path dist/TypesetOK-v0.7.0-windows-x64 -DestinationPath TypesetOK-v0.7.0-windows-desktop-app.zip

      - name: Upload Desktop App artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TypesetOK-v0.7.0-windows-desktop-app.zip
          path: TypesetOK-v0.7.0-windows-desktop-app.zip

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  # ──────────────────────────────────────────────
  # 2. Build Frontend & UI Workbench Distribution
  # ──────────────────────────────────────────────
  build-frontend:
    name: Build Frontend UI Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript packages & UI bundle
        run: npm run build

      - name: Package UI distribution bundle
        run: |
          mkdir -p dist-package
          cp -r packages/tok-ui/dist dist-package/ui
          cp -r packages/tok-electron/dist dist-package/electron
          cp -r assets dist-package/assets
          cp README.md LICENSE.md dist-package/
          tar -czvf typesetok-desktop-workbench-v0.7.0.tar.gz dist-package

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: typesetok-desktop-workbench-v0.7.0.tar.gz
          path: typesetok-desktop-workbench-v0.7.0.tar.gz

  # ──────────────────────────────────────────────
  # 3. Create GitHub Release & Attach Assets
  # ──────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-binaries, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: TypesetOK ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## TypesetOK (TOK) ${{ steps.tag.outputs.tag }}

            ### 🚀 מה חדש בגרסה 0.7.0 (Highlights):
            - **השילוש הארכיטקטוני (Interaction Triad):** מימוש מלא של Canvas Action HUD צמוד-סמן (5 פעולות מיקרו-עיצוב), Contextual Inspector מלא בצד שמאל, ו-Command Palette מרכזי (`Ctrl+K` / `Cmd+K`).
            - **יישור עברי תלת-שלבי (3-Tier Hebrew Justification):** רווחי מילים (80%–130%), מתיחת אותיות אהלתר"ם (120%), ומיקרו-טרקינג (±2%).
            - **מערכת טוקנים וצבעים רשמית (Design Tokens):** ערכת נושא כהה מותאמת דפוס, שולחן עבודה `#121212`, קווי עזר לשוליים, טורים ורשת שורות בסיס.
            - **ארגונומיה מרחבית עברית Native RTL:** סרגל ניווט ומבנה ימני (250px), כפולות עמודים ימין-שמאל (Recto/Verso), וסרגל סטטוס אינטראקטיבי (26px) עם Continuous Preflight.
            - **כיסוי בדיקות מלא:** 65 בדיקות Rust ו-23 בדיקות Frontend (סה"כ 88/88 בדיקות עוברות בהצלחה).

            ### 📦 קבצים להורדה (Pre-built Binaries):
            - **תוכנת דסקטופ מלאה עם ממשק משתמש (Windows x64):** `TypesetOK-v0.7.0-windows-desktop-app.zip` (כולל `TypesetOK.exe` להרצה ישירה ללא צורך בהתקנות נוספות).
            - **CLI בלבד (Windows x64):** `tok-cli-v0.7.0-windows-x64.zip`
            - **CLI בלבד (Linux x64):** `tok-cli-v0.7.0-linux-x64.tar.gz`
            - **CLI בלבד (macOS):** `tok-cli-v0.7.0-macos.tar.gz`
            - **Desktop UI Workbench Source Bundle:** `typesetok-desktop-workbench-v0.7.0.tar.gz`
