<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <!-- Only local code may run. 'unsafe-eval' is required by the plugin engine (new Function);
       inline styles are used throughout the component code. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypesetOK (TOK) - תוכנת עימוד מקצועית</title>
  <style>
    /* ==========================================================================
       TypesetOK (TOK) Design System & Tokens (UX/UI Specification 2.0)
       Section 11: Color System & Design Tokens
       Section 18: Responsive Design System
       ========================================================================== */
    :root {
      /* Surface Tokens */
      --tok-bg-canvas:        #121212; /* שולחן העבודה מאחורי העמודים */
      --tok-bg-app:           #181818; /* מסגרת התוכנה והסרגלים */
      --tok-bg-surface-1:     #1E1E1E; /* רקע פאנל מפקח וסרגל ניווט */
      --tok-bg-surface-2:     #262626; /* רקע שדות קלט וכפתורים משניים */
      --tok-bg-surface-hover: #2E2E2E;
      --tok-bg-elevated:      #303030; /* רקע Popovers ו-Command Palette */

      /* Border & Focus */
      --tok-border-subtle:    #2C2C2C; /* מפרידים פנימיים */
      --tok-border-strong:    #3E3E3E; /* גבולות שדות קלט וכרטיסים */
      --tok-border-focus:     #3B82F6; /* מסגרת פוקוס פעיל במקלדת */

      /* Interactive & Accent */
      --tok-accent-primary:   #2563EB; /* כפתורי פעולה מרכזיים */
      --tok-accent-hover:     #1D4ED8;
      --tok-selection-frame:  #3B82F6; /* מסגרת אובייקט נבחר בקנבס */
      --tok-selection-text:   rgba(59, 130, 246, 0.35); /* הדגשת טקסט מסומן */
      --tok-guide-margin:     #9333EA; /* קווי שוליים (סגול ברור) */
      --tok-guide-column:     #06B6D4; /* קווי טורים (טורקיז) */
      --tok-guide-baseline:   rgba(16, 185, 129, 0.25); /* רשת שורות בסיס (ירוק) */

      /* Feedback Tokens */
      --tok-status-error:     #EF4444; /* שגיאות Preflight, טקסט גולש */
      --tok-status-warning:   #F59E0B; /* תמונות ברזולוציה נמוכה, חריגות רווח */
      --tok-status-success:   #10B981; /* תקינות דפוס מלאה, ייצוא הושלם */

      /* Typography & Font Stacks */
      --tok-text-primary:     #F3F4F6;
      --tok-text-secondary:   #9CA3AF;
      --tok-text-muted:       #6B7280;
      --tok-font-system:      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --tok-font-hebrew-body: "Taamey Frank CLM", "David CLM", "Frank Ruehl CLM", serif;
      --tok-font-hebrew-rashi: "Rashi", "Taamey Frank CLM", serif;

      /* Spatial Dimensions */
      --tok-structure-width:  250px;
      --tok-inspector-width:  320px;
      --tok-top-bar-height:   44px;
      --tok-status-height:    26px;
      --tok-hud-height:       36px;
      --tok-input-height:     28px;
    }

    /* CSS Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--tok-bg-app);
      color: var(--tok-text-primary);
      font-family: var(--tok-font-system);
      user-select: none;
      -webkit-user-select: none;
      font-size: 13px;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Professional Dark Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--tok-bg-surface-1);
    }
    ::-webkit-scrollbar-thumb {
      background: #3A3A3A;
      border-radius: 4px;
      border: 1px solid var(--tok-bg-surface-1);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #525252;
    }

    /* Form Controls: Inputs, Selects, Buttons */
    .tok-input, .tok-select {
      height: var(--tok-input-height);
      background: var(--tok-bg-surface-2);
      color: var(--tok-text-primary);
      border: 1px solid var(--tok-border-strong);
      border-radius: 4px;
      padding: 0 8px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    .tok-input:focus, .tok-select:focus {
      border-color: var(--tok-border-focus);
      box-shadow: 0 0 0 1px var(--tok-border-focus);
    }
    .tok-input-number {
      text-align: left;
      font-variant-numeric: tabular-nums;
      direction: ltr;
    }

    .tok-btn {
      height: var(--tok-input-height);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      background: var(--tok-bg-surface-2);
      color: var(--tok-text-primary);
      border: 1px solid var(--tok-border-strong);
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      gap: 6px;
      font-family: inherit;
    }
    .tok-btn:hover {
      background: var(--tok-bg-surface-hover);
      border-color: #4A4A4A;
    }
    .tok-btn:active {
      transform: scale(0.98);
    }
    .tok-btn-primary {
      background: var(--tok-accent-primary);
      border-color: var(--tok-accent-primary);
      color: #FFFFFF;
      font-weight: 600;
    }
    .tok-btn-primary:hover {
      background: var(--tok-accent-hover);
      border-color: var(--tok-accent-hover);
    }

    /* Value Scrubber Component (Figma/Blender Style) */
    .tok-scrubber-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .tok-scrubber-label {
      font-size: 12px;
      color: var(--tok-text-secondary);
      cursor: ew-resize;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s;
    }
    .tok-scrubber-label:hover {
      color: #60A5FA;
    }
    .tok-scrubber-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .tok-scrubber-input {
      width: 72px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .tok-scrubber-unit {
      position: absolute;
      left: 6px;
      font-size: 11px;
      color: var(--tok-text-muted);
      pointer-events: none;
    }

    /* Inspector Card Containers */
    .tok-inspector-card {
      background: var(--tok-bg-surface-1);
      border-bottom: 1px solid var(--tok-border-subtle);
      padding: 12px 14px;
    }
    .tok-inspector-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--tok-text-primary);
      letter-spacing: 0.3px;
    }
    .tok-inspector-card-header .tok-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      background: var(--tok-bg-surface-2);
      color: var(--tok-text-secondary);
      border: 1px solid var(--tok-border-subtle);
    }

    /* Canvas Action HUD (Section 8: Canvas Action HUD) */
    .tok-action-hud {
      position: absolute;
      height: var(--tok-hud-height);
      background: var(--tok-bg-elevated);
      border: 1px solid var(--tok-border-strong);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      padding: 0 6px;
      gap: 6px;
      z-index: 900;
      animation: hudFadeIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      direction: rtl;
    }
    @keyframes hudFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .tok-hud-divider {
      width: 1px;
      height: 18px;
      background: var(--tok-border-subtle);
      margin: 0 2px;
    }

    /* Command Palette Overlay (Section 8: Command Palette) */
    .tok-palette-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 9999;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 15vh;
      animation: fadeIn 0.15s ease-out;
    }
    .tok-palette-modal {
      width: 560px;
      max-width: 90vw;
      background: var(--tok-bg-elevated);
      border: 1px solid var(--tok-border-strong);
      border-radius: 8px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      direction: rtl;
    }
    .tok-palette-input-wrap {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--tok-border-subtle);
      background: #282828;
    }
    .tok-palette-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #FFFFFF;
      font-size: 15px;
      font-family: inherit;
    }
    .tok-palette-list {
      max-height: 340px;
      overflow-y: auto;
      padding: 6px 0;
    }
    .tok-palette-item {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.1s;
    }
    .tok-palette-item.active, .tok-palette-item:hover {
      background: #2563EB;
      color: #FFFFFF;
    }
    .tok-palette-category {
      font-size: 11px;
      font-weight: 700;
      color: var(--tok-text-muted);
      padding: 8px 16px 4px;
      text-transform: uppercase;
    }

    /* Toast Notification */
    .tok-toast {
      position: fixed;
      bottom: 34px;
      left: 24px;
      background: #1E293B;
      color: #FFFFFF;
      border: 1px solid #334155;
      padding: 10px 18px;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      font-size: 13px;
      z-index: 99999;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.2s ease-out;
    }

    /* Modals & Overlays */
    .tok-welcome-overlay, .tok-settings-overlay, .tok-about-overlay {
      animation: fadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tok-welcome-card, .tok-settings-card, .tok-about-card {
      animation: modalSlideIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalSlideIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="renderer.js"></script>
</body>
</html>
